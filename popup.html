<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Naturalisation ANEF</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🇫🇷 Suivi Naturalisation</h1>
    <p class="subtitle">Dossier ANEF</p>

    <div class="card">
        <h2>Progression</h2>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <p id="progress-text">0%</p>
    </div>


    <div class="card">
        <h2>Étape actuelle</h2>

        <select id="status">
            <option value="Dossier déposé">📄 Dossier déposé</option>
            <option value="Recevabilité">✅ Recevabilité</option>
            <option value="Instruction">⏳ Instruction</option>
            <option value="Entretien">🗣️ Entretien</option>
            <option value="Décision préfectorale">🏛️ Décision préfectorale</option>
            <option value="Naturalisation acceptée">🎉 Acceptée</option>
        </select>

        <button id="save">
            Enregistrer le statut
        </button>

    </div>


    <div class="card">

        <h2>Historique</h2>

        <ul id="history">
            <li>Aucun changement enregistré</li>
        </ul>

    </div>


</div>


<script src="popup.js"></script>

</body>
</html>
